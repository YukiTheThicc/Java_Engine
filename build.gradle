plugins {
    id 'java'
}

group 'diamond-engine'
version '1.0-SNAPSHOT'

repositories {
    flatDir {
        dirs 'libs'
    }
    jcenter()
    mavenCentral()
}

ext {
    junitVersion = '5.8.2'
}

sourceCompatibility = "8"
targetCompatibility = "8"

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
}